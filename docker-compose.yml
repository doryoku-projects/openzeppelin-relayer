version: '3.8'

services:
  relayer:
    image: openzeppelin/openzeppelin-relayer:latest
    container_name: copypools-relayer
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - REDIS_URL=redis://redis:6379
      - API_KEY=${API_KEY}
      - KEYSTORE_PASSPHRASE=${KEYSTORE_PASSPHRASE}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}
      - MAINNET_RPC_URL=${MAINNET_RPC_URL}
      - LOG_LEVEL=info
      - IN_DOCKER=true
    volumes:
      - ./config:/app/config
      - ./entrypoint.sh:/app/entrypoint.sh
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: copypools-relayer-redis
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_data:/data
    restart: always

  nginx:
    image: nginx:alpine
    container_name: copypools-relayer-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - relayer
    restart: always

volumes:
  redis_data:
